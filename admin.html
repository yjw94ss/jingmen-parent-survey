<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>答卷管理后台｜荆门儿童AI需求调研</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body class="admin">

<div id="gate" class="gate">
  <div class="gate-card">
    <h2>答卷管理后台</h2>
    <p class="gate-sub">请输入口令查看收集结果</p>
    <input type="password" id="pwd" placeholder="管理口令" autocomplete="off">
    <div id="gateErr" class="err hidden"></div>
    <button class="primary" id="gateBtn">进入后台</button>
    <a class="back-link" href="index.html">← 返回家长填写页</a>
  </div>
</div>

<div id="dash" class="hidden">
  <div class="wrap">

    <header class="head">
      <h1>答卷管理后台</h1>
      <p class="sub">荆门儿童AI创意体验｜家长需求调研 · 数据仅用于市场验证</p>
      <div id="storeState" class="store-state"></div>
    </header>

    <div class="toolbar">
      <div class="stat-card">
        <div class="stat-num" id="totalNum">0</div>
        <div class="stat-label">有效答卷份数</div>
      </div>
      <div class="toolbar-btns">
        <button id="btnReload" class="ghost">刷新</button>
<button id="tab-import-btn" class="ghost primary-look">导入答卷</button>
      <button id="btnExport" class="ghost">导出 CSV</button>
      <button id="btnXlsx" class="ghost">导出 Excel</button>
      <button id="btnLogout" class="ghost">退出</button>
      </div>
    </div>

    <div class="notice hidden" id="emptyTip"></div>

    <section class="import-bar" id="importBar"></section>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="import">导入答卷</button>
      <button class="tab" data-tab="dist">分布统计</button>
      <button class="tab" data-tab="cross">交叉分析</button>
      <button class="tab" data-tab="open">开放建议</button>
      <button class="tab" data-tab="list">全部答卷</button>
      <button class="tab" data-tab="guide">使用说明</button>
    </nav>

    <section class="panel" id="panel-import"></section>
    <section class="panel hidden" id="panel-dist"></section>
    <section class="panel hidden" id="panel-cross"></section>
    <section class="panel hidden" id="panel-open"></section>
    <section class="panel hidden" id="panel-list"></section>
    <section class="panel hidden" id="panel-guide"></section>

    <p class="foot-note">统计口径：所有比例与样本分布仅作市场验证。请关注不同年龄段与区域家长的差异；
      多选题人数之和会超过总样本数，属于正常。不应以样本数量直接推算全市市场规模。</p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/questions.js"></script>
<script src="assets/store.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
